<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Good Libations - Home</title>

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&display=swap" rel="stylesheet">

  <style>
    @font-face {
      font-family: "MADE Sunflower";
      src: url("fonts/MADE_Sunflower.woff2") format("woff2"),
           url("fonts/MADE_Sunflower.woff") format("woff"),
           url("fonts/MADE_Sunflower.otf") format("opentype");
    }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      background: #000;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 50px 20px;
      text-align: center;
    }

    /* ✅ Logo replacing text title */
    .logo {
      width: 100%;
      max-width: 600px;
      margin-bottom: 40px;
    }

    .logo img {
      width: 100%;
      height: auto;
    }

    .video-wrapper {
      width: 100%;
      max-width: 800px;
      margin-bottom: 30px;
    }

    .video-container {
      position: relative;
      width: 100%;
      padding-top: 75%;
      background: black;
      overflow: hidden;
    }

    .video-poster {
      position: absolute;
      inset: 0;
      background: url("JoshLeos.png") center center / cover no-repeat;
      z-index: 2;
    }

    .stream-wrapper {
      position: absolute;
      inset: 0;
      z-index: 1;
      display: none;
    }

    .video-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 3;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .lock-icon {
      font-size: 0.8rem;
      margin-bottom: 8px;
      letter-spacing: 1px;
      font-weight: bold;
    }

    .password-box input {
      padding: 6px;
      width: 130px;
      font-size: 0.75rem;
      border-radius: 4px;
      border: 2px solid #fff;
      background: transparent;
      color: #fff;
      text-align: center;
    }

    .social-icon {
      margin-top: 12px;
    }

    .social-icon img {
      height: 50px;
    }

    footer {
      margin-top: auto;
      font-family: "MADE Sunflower", serif;
      font-size: 0.9rem;
      padding: 10px;
    }
  </style>
</head>

<body>

  <!-- ✅ PNG logo -->
  <div class="logo">
    <img src="new%20goodlibes%20logo.png" alt="Good Libations Logo">
  </div>

  <div class="video-wrapper">
    <div class="video-container">

      <div class="video-poster" id="videoPoster"></div>

      <!-- Bunny Stream iframe -->
      <div class="stream-wrapper" id="streamWrapper">
        <div style="position:relative;width:100%;height:100%;">
          <iframe
            src="https://player.mediadelivery.net/embed/658521/41f6d25c-2fb5-4d05-8d15-8bf411f450f5?loop=false&responsive=true"
            loading="lazy"
            style="border:0;position:absolute;top:0;left:0;width:100%;height:100%;"
            allow="accelerometer;gyroscope;encrypted-media;picture-in-picture;"
            allowfullscreen>
          </iframe>
        </div>
      </div>

      <!-- Password overlay -->
      <div class="video-overlay" id="overlay">
        <div class="lock-icon">ENTER PASSWORD</div>
        <div class="password-box">
          <input type="password" id="passwordInput" autocomplete="off" placeholder="Password">
        </div>
      </div>

    </div>

    <!-- Instagram -->
    <div class="social-icon">
      <a href="https://instagram.com/goodlibes?igsh=NTc4MTlwNjQ2YQ==" target="_blank" rel="noopener">
        <img src="IG.avif" alt="Instagram">
      </a>
    </div>
  </div>

  <footer>
    © 2025 Good Libations — All Rights Reserved
  </footer>

  <script>
    const overlay = document.getElementById("overlay");
    const poster = document.getElementById("videoPoster");
    const stream = document.getElementById("streamWrapper");
    const passwordInput = document.getElementById("passwordInput");

    // SHA-256 hash of "CrunchwrapSupreme"
    const correctHash =
      "9d366d854d74392bd934c6ce88c94c415017758c31d29f624e2c8a9bea686d17";

    async function hashPassword(password) {
      const encoder = new TextEncoder();
      const data = encoder.encode(password);
      const hashBuffer = await crypto.subtle.digest("SHA-256", data);
      return Array.from(new Uint8Array(hashBuffer))
        .map(b => b.toString(16).padStart(2, "0"))
        .join("");
    }

    passwordInput.addEventListener("input", async (e) => {
      const value = e.target.value.trim();
      if (value.length < 8) return;

      const hashed = await hashPassword(value);
      if (hashed === correctHash) {
        overlay.style.display = "none";
        poster.style.display = "none";
        stream.style.display = "block";
      }
    });
  </script>

</body>
</html>
