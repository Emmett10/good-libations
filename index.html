<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Good Libations - Home</title>

  https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&display=swap

  <style>
    @font-face {
      font-family: "MADE Sunflower";
      src: url("fonts/MADE_Sunflower.woff2") format("woff2"),
           url("fonts/MADE_Sunflower.woff") format("woff"),
           url("fonts/MADE_Sunflower.otf") format("opentype");
    }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      background: #000;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 50px 20px;
      text-align: center;
    }

    h1 {
      font-family: 'Times New Roman', serif;
      font-weight: bold;
      font-size: 2vw;
      margin-bottom: 40px;
      line-height: 1;
    }

    h1 span { display: block; }

    @media (max-width: 600px) {
      h1 { font-size: 6vw; }
    }

    .video-wrapper {
      width: 100%;
      max-width: 800px;
      margin-bottom: 30px;
    }

    .video-container {
      position: relative;
      width: 100%;
      padding-top: 75%;
      background: black;
      overflow: hidden;
    }

    video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: black;
      z-index: 1;
    }

    .video-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.65);
      z-index: 2;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .lock-icon {
      font-size: 0.9rem;
      margin-bottom: 10px;
      letter-spacing: 1px;
      font-weight: bold;
    }

    .password-box input {
      padding: 6px;
      width: 150px;
      font-size: 0.8rem;
      border-radius: 4px;
      border: 2px solid #fff;
      background: transparent;
      color: #fff;
      text-align: center;
    }

    .social-icon {
      margin-top: 15px;
    }

    .social-icon img {
      height: 50px;
    }

    footer {
      margin-top: auto;
      font-family: "MADE Sunflower", serif;
      font-size: 0.9rem;
      padding: 10px;
    }
  </style>
</head>

<body>

<h1>
  <span>GOOD</span>
  <span>LIBATIONS</span>
</h1>

<div class="video-wrapper">
  <div class="video-container">

    <!-- ✅ controls ENABLED from start (Safari requirement) -->
    <video
      id="mainVideo"
      muted
      playsinline
      preload="metadata"
      controls
      controlsList="nodownload"
      oncontextmenu="return false">
      https://good-libations.b-cdn.net/new-josh-upload.mp4
    </video>

    <div class="video-overlay" id="overlay">
      <div class="lock-icon">ENTER PASSWORD</div>
      <div class="password-box">
        <input
          type="password"
          id="passwordInput"
          autocomplete="off"
          placeholder="Password">
      </div>
    </div>

  </div>

  <div class="social-icon">
    https://instagram.com/goodlibes?igsh=NTc4MTlwNjQ2YQ==
      IG.avif
    </a>
  </div>
</div>

<footer>
  © 2025 Good Libations — All Rights Reserved
</footer>

<script>
  const overlay = document.getElementById("overlay");
  const passwordInput = document.getElementById("passwordInput");

  let enteredPassword = "";

  const correctHash =
    "9d366d854d74392bd934c6ce88c94c415017758c31d29f624e2c8a9bea686d17";

  async function hashPassword(password) {
    const encoder = new TextEncoder();
    const data = encoder.encode(password);
    const hashBuffer = await crypto.subtle.digest("SHA-256", data);
    return [...new Uint8Array(hashBuffer)]
      .map(b => b.toString(16).padStart(2, "0"))
      .join("");
  }

  passwordInput.addEventListener("input", async (e) => {
    const value = e.target.value;
    enteredPassword = value;

    e.target.value = "•".repeat(value.length);

    const hashed = await hashPassword(enteredPassword);

    if (hashed === correctHash) {
      overlay.style.display = "none";
      // ✅ User must CLICK the play button in Safari
    }
  });
</script>

</body>
</html>
